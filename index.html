/* v1.3: final replay and international */
.final-scoreboard{background:linear-gradient(145deg,#233754,#111d30);border:1px solid #466582;border-radius:17px;padding:18px;text-align:center}

.final-score-line .dash{color:var(--gold);font-size:28px;font-weight:800;flex:0}
.sim-court{height:160px;position:relative;border:2px solid #bb925c;border-radius:12px;background:repeating-linear-gradient(90deg,#255077,#255077 48px,#2a557c 48px,#2a557c 50px);margin:13px 0;overflow:hidden}

.sim-feed{background:#0a1420;border:1px solid #2a3f58;border-radius:9px;padding:11px;height:70px;overflow:hidden;font-size:12px;color:#d2e4ee;line-height:1.7}
.sim-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.sim-controls .btn{flex:1}

const fibaMenRanking={"미국":[1,952.3],"독일":[2,877.4],"프랑스":[3,870.9],"세르비아":[4,870.6],"캐나다":[5,863],"스페인":[6,822.1],"호주":[7,822],"아르헨티나":[8,809.2],"튀르키예":[9,808.1],"리투아니아":[10,801.3],"브라질":[11,799],"그리스":[13,784.4],"이탈리아":[15,745.4],"폴란드":[19,651.2],"일본":[22,550.7],"뉴질랜드":[25,515.2],"멕시코":[26,478.6],"중국":[30,469.1],"레바논":[33,461.8],"필리핀":[40,397.3],"영국":[48,351.3],"대한민국":[57,282.7],"대만":[71,210],"인도네시아":[92,121.3]};
const intCountries=Object.keys(fibaMenRanking);
function nationalPower(country){
 const entry=fibaMenRanking[country];
 return Math.round(52+(entry?.[1]??200)*.044);
}
function nationalWinChance(ourPower,opponent){
 return clamp(1/(1+10**((nationalPower(opponent)-ourPower)/34)),.08,.92);
}
function opponentFor(league,own){
 const teams=league==='고교 리그'?(schoolsByCountry[state?.player?.schoolCountry]||schoolsByCountry['대한민국']):league==='대학 리그'?leagues['College (미국)'].teams:(leagues[league]?.teams||[]);
 const arr=teams.filter(t=>t!==own);
 if(arr.length)return pick(arr);

function makeFinalSeries(ourTeam,opponent,ourPower,rivalPower,bestOf=1,title='결승전'){
 const required=Math.ceil(bestOf/2),games=[];
 let ourWins=0,oppWins=0, idx=0;
 const advantage=clamp((ourPower-rivalPower)*.045,-1.8,1.8);
 while(ourWins<required&&oppWins<required&&idx<bestOf){
  idx++;let a=0,b=0,steps=[];
  for(let q=1;q<=4;q++){
   for(let t=0;t<9;t++){
    const us=Math.max(0,Math.round(rnd(1.5,4.6)+advantage*.5)),them=Math.max(0,Math.round(rnd(1.5,4.6)-advantage*.5));
    a+=us;b+=them;
    steps.push({q,time:`${String(Math.floor((8-t)*10/8)).padStart(2,'0')}:${String(irnd(0,59)).padStart(2,'0')}`,a,b,lead:us>=them?'a':'b',comment:us>them?`${ourTeam} 공격이 성공하면서 흐름을 끌어옵니다!`:them>us?`${opponent}가 반격에 나섭니다!`:'양 팀이 치열하게 점수를 주고받습니다.'});
   }
  }
  let ot=0;while(a===b&&ot<3){ot++;for(let t=0;t<4;t++){const us=irnd(1,3),them=irnd(0,3);a+=us;b+=them;steps.push({q:'OT'+ot,time:`0${3-t}:00`,a,b,lead:us>=them?'a':'b',comment:'연장전! 마지막까지 승부를 알 수 없습니다.'})}}
  if(a===b){a++;steps.push({q:'OT',time:'00:01',a,b,lead:'a',comment:'종료 직전 결승 득점!'})}
  if(a>b)ourWins++;else oppWins++;
  games.push({game:idx,our:a,opp:b,win:a>b,seriesA:ourWins,seriesB:oppWins,steps});
 }
 return {title,ourTeam,opponent,bestOf,ourWins,oppWins,champion:ourWins>oppWins,games};
}
function intlCompetitionFor(year,age){
 if(age<19)return (year%2===1)?(age<=17?'U17 국가대표 국제대회 (게임)':'U19 국가대표 국제대회 (게임)'):null;
 if(year%4===3)return 'FIBA 농구 월드컵 (게임 일정)';
 if(year%4===0)return '올림픽 농구 (게임 일정)';

function simulateInternational(s,r,confirmed=false){
 const name=intlCompetitionFor(r.year,r.age);if(!name)return null;
 const strength=getOvr(s);
 const report={year:r.year,competition:name,country:s.player.nationality,selected:false,finish:'미선발',group:'–',medal:'없음',final:null,stats:null};
 if(!confirmed)return report;
 report.selected=true;report.accepted=true;s.intlTotals.appearances++;
 const pool=intCountries.filter(country=>country!==report.country);
 const nextRival=()=>pool.splice(irnd(0,pool.length-1),1)[0];
 const teamPow=nationalPower(report.country)+clamp((strength-70)*.22,-4,7);
 let w=0,l=0;
 for(let i=0;i<3;i++){if(chance(nationalWinChance(teamPow,nextRival())))w++;else l++}
 report.group=`${w}승 ${l}패`;
 const pg=Math.max(2,Math.round((r.ppg||10)*rnd(.72,1.12))),rp=Math.max(1,Math.round((r.rpg||4)*rnd(.7,1.18))),ap=Math.max(1,Math.round((r.apg||3)*rnd(.7,1.18)));
 report.stats={ppg:pg,rpg:rp,apg:ap};
 if(w===0){report.finish='조별리그 탈락';return report}
 if(!chance(nationalWinChance(teamPow,nextRival()))){report.finish='8강 탈락';return report}
 if(!chance(nationalWinChance(teamPow,nextRival()))){
  report.finish='4강 탈락';
  if(chance(nationalWinChance(teamPow,nextRival()))){report.medal='동메달';s.intlTotals.bronze++}
  return report;
 }
 const finalists=[nextRival(),nextRival()].sort((a,b)=>nationalPower(b)-nationalPower(a));
 const rival=finalists[0];
 const margin=(teamPow-nationalPower(rival))*.32+rnd(-10,10);
 report.final=makeFinalSeries(report.country,rival,75+margin,75,1,name+' 결승');
 if(report.final.champion){report.finish='국제대회 우승';report.medal='금메달';s.intlTotals.gold++;s.awards.national++;r.earned.push(name+' 금메달')}
 else{report.finish='준우승';report.medal='은메달';s.intlTotals.silver++;r.earned.push(name+' 은메달')}
 return report;
}

function freeThrowChance(value){
 const timing=freeThrow?.difficulty||freeThrowDifficulty(state?.attrs);
 if(value>=timing.start&&value<=timing.end)return 1;
 if(value>=.5-timing.yellow&&value<=.5+timing.yellow)return .5;
 return .01;
}
function replayFoul(game,index){
 if(game.steps.length<14)return 0;
 if(game.game%2===0){
  const andOne=game.steps.findIndex((frame,i)=>i>=10&&i<27&&frame.a-game.steps[i-1].a>=2);
  if(andOne>=0)return index===andOne?1:0;
 }
 return index===12?2:0;
}

function startFreeThrowAim(){

 attempt.shooting=false;

 const ball=document.getElementById('ftBall');
 ball.className='ft-ball';
 button.disabled=false;

 document.getElementById('ftStatus').textContent='표시가 초록 구간에 들어오면 눌러!';
 button.focus({preventScroll:true});
 const needle=document.getElementById('ftNeedle');
 function aim(now){
  if(freeThrow!==attempt||attempt.shooting)return;
  const cycle=((now-start)%attempt.difficulty.duration)/(attempt.difficulty.duration/2);
  attempt.position=cycle<=1?cycle:2-cycle;
  needle.style.left=`${attempt.position*100}%`;
  freeThrowAnimation=requestAnimationFrame(aim);
 }

}
function shootReplayFreeThrow(){

 if(!attempt||attempt.shooting)return;

 cancelAnimationFrame(freeThrowAnimation);
 const made=chance(freeThrowChance(attempt.position));
 replayFreeThrows.attempted++;
 if(made)replayFreeThrows.made++;

 document.getElementById('ftBall').classList.add(made?'ft-made':'ft-missed');
 freeThrowTimeout=setTimeout(()=>{
  if(freeThrow!==attempt)return;

   if(freeThrow!==attempt)return;
   if(attempt.shot<attempt.count){attempt.shot++;startFreeThrowAim();return}
   clearFreeThrows();

   panel.closest('.modal').classList.remove('is-free-throw');

let finalsTimeout=null;
function finalsEvent(game,index){
 const frame=game.steps[index],prior=game.steps[index-1];
 if(!frame||!prior)return '';
 const gap=frame.a-frame.b,oldGap=prior.a-prior.b;
 if(typeof frame.q==='string')return index===36?'연장전 · 한 번의 공격이 승부를 가릅니다.':'';
 if(index===17)return '하프타임 · 라커룸에서 후반 수비를 점검합니다.';
 if(index===27)return '4쿼터 · 마지막 10분, 벤치가 선수들을 독려합니다.';
 if(index>=30&&Math.abs(gap)<=5)return '클러치 타임 · 한 번의 실수도 허용할 수 없습니다.';
 if(oldGap<0&&gap>0)return '역전! · 우리 팀이 리드를 가져옵니다.';
 if(oldGap>0&&gap<0)return '리드 허용 · 상대 팀이 흐름을 가져갑니다.';
 const recent=game.steps[Math.max(0,index-3)];
 const run=(frame.a-recent.a)-(frame.b-recent.b);
 if(index>2&&run>=6)return '득점 러시 · 관중석이 뜨겁게 달아오릅니다.';
 if(index>2&&run<=-6)return '상대의 추격 · 감독이 벤치에서 수비를 지시합니다.';
 if(frame.a-prior.a>=4)return '속공 전개 · 수비를 따돌리고 연속 득점!';
 if(index===5)return '강한 압박 수비 · 공을 안전하게 지켜야 합니다.';
 if(index===22)return '교체 투입 · 벤치 선수들이 코트에 활기를 더합니다.';
 return '';
}

function replayTick(){
 const game=replaySeries?.games?.[replayGame];if(!game)return finishReplaySeries();
 const frame=game.steps[replayStep++];
 if(frame){
  const stamp=typeof frame.q==='number'?`${frame.q}쿼터`:`${frame.q}`;
  document.getElementById('replayPhase').textContent=`GAME ${game.game} · ${stamp} · ${frame.time}`;
  document.getElementById('simOur').textContent=frame.a;document.getElementById('simOpp').textContent=frame.b;
  document.getElementById('simFeed').textContent=koText(frame.comment);
  const n=replayStep;
  const event=finalsEvent(game,n-1);
  const eventBox=document.getElementById('finalsEvent');
  if(event){eventBox.textContent=event;eventBox.hidden=false;}
  else if(n%4===0)eventBox.hidden=true;
  document.getElementById('simPlayerA').style.transform=`translate(${Math.sin(n)*23}px,${Math.cos(n)*26}px)`;
  document.getElementById('simPlayerB').style.transform=`translate(${Math.cos(n)*-25}px,${Math.sin(n)*28}px)`;
  document.getElementById('simBall').style.left=frame.lead==='a'?'33%':'67%';
  document.getElementById('simBall').style.top=`${38+(n%5)*6}%`;
  const foul=replayFoul(game,n-1);
  if(foul)openFreeThrows(foul);
  else openFinalsTimeout(n-1);
 }else{
  document.getElementById('simFeed').textContent=`${game.game}차전 종료! ${game.our} : ${game.opp} · ${koTeam(game.win?replaySeries.ourTeam:replaySeries.opponent)} 승리`;
  document.getElementById('simSeries').textContent=`시리즈 ${game.seriesA} : ${game.seriesB}`;
  replayGame++;replayStep=0;
  if(replayGame>=replaySeries.games.length)finishReplaySeries();
 }
}

function careerWallet(s){
  return s.wallet??={balance:500,lastIncome:0,purchase:null};
}
function seasonIncome(stage,salary){
  if(stage==='HIGH')return 300;
  if(stage==='COLLEGE')return 500;
  return Math.max(0,Math.floor(Number(salary)||0));
}
function itemGain(s,item){
  const ceiling=s.potential+(s.focus===item.stat?2:0);
  return Math.max(0,Math.min(item.boost,ceiling-s.attrs[item.stat]));
}
function purchaseItem(s,id){
  const item=seasonItems.find(entry=>entry.id===id);
  const wallet=careerWallet(s);
  if(!item||s.retired||wallet.purchase?.year===s.year||wallet.balance<item.price)return false;
  const gain=itemGain(s,item);
  if(!gain)return false;
  s.attrs[item.stat]+=gain;
  wallet.balance-=item.price;
  wallet.purchase={year:s.year,id,gain};
  return true;
}

async function weeklyRankRequest(method,payload={}){

    method:'POST',

const trainingBudget=4;
const positionPriorities={
  PG:['pass','iq','shoot'],SG:['shoot','drive','clutch'],SF:['drive','shoot','defense'],
  PF:['rebound','defense','stamina'],C:['defense','rebound','stamina']
};
function trainingPlan(s){
  if(s.trainingPlan)return s.trainingPlan;
  const priority=positionPriorities[s.player.position]||positionPriorities.SF;
  const focus=Object.hasOwn(attrs,s.focus)?s.focus:priority[0];
  return {[focus]:2,[priority.find(stat=>stat!==focus)]:2};
}
function positionRating(s){
  const priority=positionPriorities[s.player.position]||positionPriorities.SF;
  const [primary,secondary,support]=priority.map(stat=>s.attrs[stat]);
  return primary*.4+secondary*.35+support*.25;
}
function adjustTraining(stat,delta){

  const plan=trainingPlan(s);

  if(value<0||value>2||Object.values(plan).reduce((sum,n)=>sum+n,0)+delta>trainingBudget)return;

  save();

  (control?.disabled?control.parentElement:control)?.focus({preventScroll:true});
}

  return `${panelTitle('훈련 및 성장',`<span class="pill gold">현재 OVR ${getOvr(s)}</span>`)}<div class="grid two"><div class="card">

  if(age>33&&['drive','stamina','defense','rebound'].includes(stat))change-=.35+(age-33)*.11;
  if(age>39&&stat==='stamina')change-=.6;
  const target=clamp(value+change,30,Math.max(value,ceiling));
  const whole=Math.floor(target);
  return whole+(chance(target-whole)?1:0);
}

function showSeasonProgress(s){
  const phases=['시즌 개막','시즌 초반','시즌 중반','시즌 후반','시즌 마무리'];
  const dialog=document.createElement('dialog');
  dialog.className='season-progress';
  dialog.setAttribute('aria-labelledby','season-progress-title');
  dialog.innerHTML=`<h2 id="season-progress-title">${s.year} 시즌 자동 진행</h2>
    <p class="desc">${teamLabel(s.team)} · ${esc(leagueName(s))}</p>
    <p role="status" class="season-phase"></p>
    <progress max="100" value="0" aria-label="시즌 진행률"></progress>
    <div class="season-progress-actions"><button type="button" class="btn small">바로 결과 보기</button></div>`;
  document.body.append(dialog);
  dialog.showModal();
  return new Promise(resolve=>{
    const duration=2800;
    const start=performance.now();
    const meter=dialog.querySelector('progress');
    const status=dialog.querySelector('.season-phase');
    let frame;
    const finish=()=>{
      cancelAnimationFrame(frame);
      dialog.close();
      dialog.remove();
      resolve();
    };
    function update(now){
      const fraction=Math.min(1,(now-start)/duration);
      meter.value=Math.round(fraction*100);
      const phase=phases[Math.min(phases.length-1,Math.floor(fraction*phases.length))];
      if(status.textContent!==phase)status.textContent=phase;
      if(fraction<1)frame=requestAnimationFrame(update);
      else finish();
    }
    dialog.addEventListener('cancel',event=>{event.preventDefault();finish()});
    dialog.querySelector('button').addEventListener('click',finish);
    update(start);
  });
}

<script type="module">
let visitorStatus='접속자 연결 중';
function renderVisitorCount(){
 const target=document.querySelector('.career-header-meta')||document.querySelector('.welcome-intro')||document.querySelector('.intro-header');
 if(!target)return;
 let label=target.querySelector('.visitor-indicator');
 if(!label){label=document.createElement('span');label.className='visitor-indicator';target.append(label)}
 if(label.textContent!==visitorStatus)label.textContent=visitorStatus;
}
const visitorObserver=new MutationObserver(renderVisitorCount);
visitorObserver.observe(document.getElementById('app'),{childList:true,subtree:true});
renderVisitorCount();
try{
 const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/+esm');
 let browserId;
 try{
  browserId=localStorage.getItem('rtg-presence-id')||crypto.randomUUID();
  localStorage.setItem('rtg-presence-id',browserId);
 }catch{browserId=crypto.randomUUID()}
 const client=createClient(weeklyRankUrl.replace('/rest/v1/rpc/',''),weeklyRankKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const room=client.channel('road-to-goat-visitors',{config:{presence:{key:browserId}}});
 let tracking=false;
 room.on('presence',{event:'sync'},()=>{
  if(!tracking)return;
  visitorStatus='접속 중 '+Object.keys(room.presenceState()).length+'명';
  renderVisitorCount();
 });
 room.subscribe(async status=>{
  if(status==='SUBSCRIBED'){
   const result=await room.track({online:true});
   tracking=result==='ok';
   visitorStatus=tracking?'접속 중 '+Object.keys(room.presenceState()).length+'명':'접속자 연결 대기';
  }else if(['CLOSED','CHANNEL_ERROR','TIMED_OUT'].includes(status)){
   tracking=false;
   visitorStatus='접속자 연결 대기';
  }
  renderVisitorCount();
 });
 window.addEventListener('pagehide',()=>{client.removeChannel(room)});
 window.addEventListener('pageshow',event=>{if(event.persisted)location.reload()});
}catch{
 visitorStatus='접속자 연결 대기';
 renderVisitorCount();
}

</script>
