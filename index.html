/* v1.3: final replay and international */
.final-scoreboard{background:linear-gradient(145deg,#233754,#111d30);border:1px solid #466582;border-radius:17px;padding:18px;text-align:center}

 // neck + ears + face
 px(16,18,8,4,low);px(11,9,18,12,skin);px(10,13,2,5,low);px(28,13,2,5,low);px(13,9,14,2,shade(skin,1.1));px(15,15,2,2,'#212c32');px(23,15,2,2,'#212c32');px(18,19,4,1,shade(skin,.6));
 // six hair shapes
 px(11,6,18,5,hair);

const intCountries=['대한민국','미국','캐나다','일본','중국','호주','프랑스','독일','스페인','이탈리아','튀르키예','그리스','세르비아','브라질','아르헨티나','필리핀','리투아니아','폴란드','영국','멕시코','대만','레바논','인도네시아','뉴질랜드'];
function opponentFor(league,own){
 const teams=league==='고교 리그'?(schoolsByCountry[state?.player?.schoolCountry]||schoolsByCountry['대한민국']):league==='대학 리그'?leagues['College (미국)'].teams:(leagues[league]?.teams||[]);
 const arr=teams.filter(t=>t!==own);
 if(arr.length)return pick(arr);
 return own+' 라이벌팀';
}
function makeFinalSeries(ourTeam,opponent,ourPower,rivalPower,bestOf=1,title='결승전'){
 const required=Math.ceil(bestOf/2),games=[];
 let ourWins=0,oppWins=0, idx=0;
 const advantage=clamp((ourPower-rivalPower)*.045,-1.8,1.8);
 while(ourWins<required&&oppWins<required&&idx<bestOf){
  idx++;let a=0,b=0,steps=[];
  for(let q=1;q<=4;q++){
   for(let t=0;t<9;t++){
    const us=Math.max(0,Math.round(rnd(1.5,4.6)+advantage*.5)),them=Math.max(0,Math.round(rnd(1.5,4.6)-advantage*.5));
    a+=us;b+=them;
    steps.push({q,time:`${String(Math.floor((8-t)*10/8)).padStart(2,'0')}:${String(irnd(0,59)).padStart(2,'0')}`,a,b,lead:us>=them?'a':'b',comment:us>them?`${ourTeam} 공격이 성공하면서 흐름을 끌어옵니다!`:them>us?`${opponent}가 반격에 나섭니다!`:'양 팀이 치열하게 점수를 주고받습니다.'});
   }
  }
  let ot=0;while(a===b&&ot<3){ot++;for(let t=0;t<4;t++){const us=irnd(1,3),them=irnd(0,3);a+=us;b+=them;steps.push({q:'OT'+ot,time:`0${3-t}:00`,a,b,lead:us>=them?'a':'b',comment:'연장전! 마지막까지 승부를 알 수 없습니다.'})}}
  if(a===b){a++;steps.push({q:'OT',time:'00:01',a,b,lead:'a',comment:'종료 직전 결승 득점!'})}
  if(a>b)ourWins++;else oppWins++;
  games.push({game:idx,our:a,opp:b,win:a>b,seriesA:ourWins,seriesB:oppWins,steps});
 }
 return {title,ourTeam,opponent,bestOf,ourWins,oppWins,champion:ourWins>oppWins,games};
}
function intlCompetitionFor(year,age){
 if(age<19)return (year%2===1)?(age<=17?'U17 국가대표 국제대회 (게임)':'U19 국가대표 국제대회 (게임)'):null;
 if(year%4===3)return 'FIBA 농구 월드컵 (게임 일정)';
 if(year%4===0)return '올림픽 농구 (게임 일정)';
 if(year%4===1)return '대륙별 국가대표 선수권 (게임)';
 return null;
}
function simulateInternational(s,r,confirmed=false){
 const name=intlCompetitionFor(r.year,r.age);if(!name)return null;
 const strength=getOvr(s),eligible=clamp(.12+(strength-60)*.022,.1,.92);
 const report={year:r.year,competition:name,country:s.player.nationality,selected:false,finish:'미선발',group:'–',medal:'없음',final:null,stats:null};
 if(!confirmed)return report;
 report.selected=true;report.accepted=true;s.intlTotals.appearances++;
 const pool=intCountries.filter(c=>c!==report.country),teamPow=clamp(62+(strength-70)*.45,52,91);
 let w=0,l=0;
 for(let i=0;i<3;i++){const opp=pick(pool),prob=clamp(.51+(teamPow-(66+hash(opp)%21))*.012,.2,.82);if(chance(prob))w++;else l++}
 report.group=`${w}승 ${l}패`;
 const pg=Math.max(2,Math.round((r.ppg||10)*rnd(.72,1.12))),rp=Math.max(1,Math.round((r.rpg||4)*rnd(.7,1.18))),ap=Math.max(1,Math.round((r.apg||3)*rnd(.7,1.18)));
 report.stats={ppg:pg,rpg:rp,apg:ap};
 if(w===0){report.finish='조별리그 탈락';return report}
 const baseProb=clamp(.44+(teamPow-75)*.021,.18,.78);
 if(!chance(baseProb)){report.finish='8강 탈락';return report}
 if(!chance(baseProb)){report.finish='4강 탈락';if(chance(.43)){report.medal='동메달';s.intlTotals.bronze++}return report}
 const rival=pick(pool);
 report.final=makeFinalSeries(report.country,rival,teamPow,64+hash(rival)%24,1,name+' 결승');
 if(report.final.champion){report.finish='국제대회 우승';report.medal='금메달';s.intlTotals.gold++;s.awards.national++;r.earned.push(name+' 금메달')}
 else{report.finish='준우승';report.medal='은메달';s.intlTotals.silver++;r.earned.push(name+' 은메달')}
 return report;
}

function careerWallet(s){
  return s.wallet??={balance:500,lastIncome:0,purchase:null};

function seasonIncome(stage,salary){
  if(stage==='HIGH')return 300;
  if(stage==='COLLEGE')return 500;
  return Math.max(0,Math.floor(Number(salary)||0));
}
function itemGain(s,item){
  const ceiling=s.potential+(s.focus===item.stat?2:0);
  return Math.max(0,Math.min(item.boost,ceiling-s.attrs[item.stat]));
}
function purchaseItem(s,id){
  const item=seasonItems.find(entry=>entry.id===id);
  const wallet=careerWallet(s);
  if(!item||s.retired||wallet.purchase?.year===s.year||wallet.balance<item.price)return false;
  const gain=itemGain(s,item);
  if(!gain)return false;
  s.attrs[item.stat]+=gain;
  wallet.balance-=item.price;
  wallet.purchase={year:s.year,id,gain};
  return true;
}

if(kind==='graduate'||kind==='collegeEnd'){pool=ovr>=76?['NBA G League','NBA','KBL','B.LEAGUE','ACB (스페인)','NBL (호주)','BBL (독일)']:['NBA G League','KBL','B.LEAGUE','CBA','NBL (호주)','ÉLITE (프랑스)','PLK (폴란드)'];}
else{pool=ovr>83?['NBA','NBA','NBA G League','ACB (스페인)','B.LEAGUE','KBL']:ovr>71?['NBA G League','NBA','KBL','B.LEAGUE','ACB (스페인)','BBL (독일)','NBL (호주)']:['NBA G League','KBL','B.LEAGUE','CBA','NBL (호주)','PBA (필리핀)','NBB (브라질)'];}

if(kind==='graduate' || kind==='collegeEnd'){
arr.push({id:'c1',league:'College (미국)',team:'East Coast University',years:4,salary:0,role:roleFromOvr(ovr,'college'),power:74});arr.push({id:'c2',league:'College (미국)',team:'Pacific State University',years:4,salary:0,role:roleFromOvr(ovr,'college'),power:76});

function showSeasonProgress(s){
  const phases=['시즌 개막','시즌 초반','시즌 중반','시즌 후반','시즌 마무리'];
  const dialog=document.createElement('dialog');
  dialog.className='season-progress';
  dialog.setAttribute('aria-labelledby','season-progress-title');
  dialog.innerHTML=`<h2 id="season-progress-title">${s.year} 시즌 자동 진행</h2>
    <p class="desc">${esc(koTeam(s.team))} · ${esc(leagueName(s))}</p>
    <p role="status" class="season-phase"></p>
    <progress max="100" value="0" aria-label="시즌 진행률"></progress>
    <div class="season-progress-actions"><button type="button" class="btn small">바로 결과 보기</button></div>`;
  document.body.append(dialog);
  dialog.showModal();
  return new Promise(resolve=>{
    const duration=2800;
    const start=performance.now();
    const meter=dialog.querySelector('progress');
    const status=dialog.querySelector('.season-phase');
    let frame;
    const finish=()=>{
      cancelAnimationFrame(frame);
      dialog.close();
      dialog.remove();
      resolve();
    };
    function update(now){
      const fraction=Math.min(1,(now-start)/duration);
      meter.value=Math.round(fraction*100);
      const phase=phases[Math.min(phases.length-1,Math.floor(fraction*phases.length))];
      if(status.textContent!==phase)status.textContent=phase;
      if(fraction<1)frame=requestAnimationFrame(update);
      else finish();
    }
    dialog.addEventListener('cancel',event=>{event.preventDefault();finish()});
    dialog.querySelector('button').addEventListener('click',finish);
    update(start);
  });
}

function history(s){return `${panelTitle('시즌 기록',`<span class="pill">${s.history.length}시즌 기록</span>`)}<div class="card"><h3>시즌 누적 기록 (평균이 아닌 총합)</h3>${s.history.length?`<div class="table-wrap"><table><thead><tr><th>연도</th><th>나이</th><th>소속</th><th>리그</th><th>출전 경기</th><th>총 득점</th><th>총 리바운드</th><th>총 어시스트</th><th>OVR</th><th>결승전</th><th>수상</th></tr></thead><tbody>${[...s.history].reverse().map(x=>`<tr><td><strong>${x.year}</strong></td><td>${x.age}</td><td>${esc(koTeam(x.team))}</td><td>${esc(x.league)}</td><td>${x.games}</td><td><strong>${fmt(x.pts)}</strong></td><td><strong>${fmt(x.reb)}</strong></td><td><strong>${fmt(x.ast)}</strong></td><td>${x.ovr}</td><td>${x.final?`<button class="btn secondary small" onclick="replayFinal(${x.year},'club')">▶ 관전</button>`:'–'}</td><td>${x.earned.length?esc(x.earned.join(', ')):'–'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">아직 시즌 기록이 없어. 첫 시즌을 자동 진행해 줘.</div>`}</div><div class="card" style="margin-top:15px"><h3>커리어 뉴스</h3>${s.events.length?s.events.slice(0,25).map(x=>`<div class="history-item"><div class="label">${x.year}년</div><p class="desc" style="margin:4px 0 0">${esc(koText(x.text))}</p></div>`).join(''):'<div class="empty">시즌을 진행하면 주요 이벤트가 쌓여.</div>'}</div>`}
function awards(s){const values=[['🏆','NBA 정규 시즌 MVP',s.awards.mvp],['🥇','NBA 파이널 MVP',s.awards.fmvp],['💍','NBA 챔피언',s.awards.rings],['⭐','NBA 올스타',s.awards.allstar],['🎖','올NBA',s.awards.allnba],['🎯','NBA 득점왕',s.awards.scoring],['🛡','NBA 수비왕',s.awards.dpoy],['🌱','NBA 신인왕',s.awards.rookie],['🌍','세계 올해의 농구선수 (게임)',s.awards.world],['🏀','해외 리그 MVP',s.awards.othermvp],['📘','고교 MVP',s.awards.highmvp],['🎓','대학 MVP',s.awards.collegemvp]];return `${panelTitle('트로피 보관함',`<span class="pill gold">총 ${values.reduce((t,x)=>t+x[2],0)}개</span>`)}<div class="grid three">${values.map(([icon,label,n])=>`<div class="trophy"><span class="sym">${icon}</span><div><div class="label">${label}</div><div class="value" style="font-size:19px;margin-top:4px">${n}회</div></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>수상 연혁</h3>${s.history.filter(x=>x.earned.length).length?s.history.filter(x=>x.earned.length).reverse().map(x=>`<div class="history-item"><div style="font-weight:800;font-size:13px">${x.year} · ${esc(koTeam(x.team))}</div><div class="result-tags">${x.earned.map(a=>`<span>🏆 ${esc(a)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">첫 트로피를 획득하면 여기에 기록돼.</div>'}</div>`}
function goat(s){const score=goatScore(s);const ranklist=[...legendRanks.map(x=>({name:x[0],score:x[1],me:false})),{name:s.player.name,score,me:true}].sort((a,b)=>b.score-a.score);const rank=goatRank(s);return `${panelTitle('GOAT 역대 랭킹',`<span class="pill gold">${level(s)}</span>`)}<div class="hero" style="min-height:160px"><div class="hero-content"><div class="eyebrow">GREATEST OF ALL TIME</div><h2 style="margin:8px 0">역대 ${rank}위 <span class="highlight">/ ${score} PTS</span></h2><p>NBA MVP, 파이널 MVP, 우승, 개인 기록으로 역대 랭킹을 끌어올려. 장기적으로 랭킹 1위를 목표로 하자.</p></div></div><div class="card"><h3>명예의 전당 · 역대 랭킹</h3><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>GOAT 점수</th></tr></thead><tbody>${ranklist.map((x,i)=>`<tr style="${x.me?'background:#3b3228':''}"><td class="rank-num">#${i+1}</td><td><strong>${esc(x.name)}${x.me?' (내 선수)':''}</strong></td><td>${fmt(x.score)}</td></tr>`).join('')}</tbody></table></div><p class="smallnote" style="margin-top:12px">전설 A~J는 게임의 가상 기준 선수이며 GOAT 점수는 게임 전용 평가 지표입니다. 실제 역사상 선수 순위를 뜻하지 않습니다.</p></div><div class="grid three" style="margin-top:15px">${statbox('NBA MVP',s.awards.mvp+'회','평가 비중 높음')}${statbox('파이널 MVP',s.awards.fmvp+'회','평가 비중 높음')}${statbox('NBA 챔피언',s.awards.rings+'회','우승 경력')}${statbox('NBA 통산 득점',fmt(s.totals.nbaPts),'NBA만 합산')}${statbox('NBA 통산 어시스트',fmt(s.totals.nbaAst),'NBA만 합산')}${statbox('NBA 통산 리바운드',fmt(s.totals.nbaReb),'NBA만 합산')}</div>`}
function settings(s){return `${panelTitle('설정')}<div class="card"><h3>게임 상태</h3><div class="grid two"><div class="mini-box"><span class="label">현재 저장</span><strong style="font-size:15px">${esc(s.player.name)} · ${s.year}</strong></div><div class="mini-box"><span class="label">커리어</span><strong style="font-size:15px">${s.retired?'은퇴':'진행 중'}</strong></div></div><div class="sep"></div><div style="display:flex;flex-wrap:wrap;gap:9px"><button class="btn secondary" onclick="exportSave()">저장 데이터 백업</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">백업 불러오기</button><input type="file" id="importFile" accept=".json,application/json" class="hidden" onchange="importSave(event)"><button class="btn secondary" onclick="save();toast('게임이 저장됐어.')">지금 저장</button></div></div><div class="card" style="margin-top:16px"><h3>은퇴 시스템</h3><p class="desc">시즌 종료 후 원하는 시점에 은퇴할 수 있어. 계약이 끝났을 때 새 제안이 없으면 은퇴해.</p><button class="btn danger" onclick="confirmRetirement()" ${s.retired?'disabled':''}>선수 은퇴하기</button>${s.retired?`<p class="desc">${esc(s.retireReason)}</p>`:''}</div><div class="card" style="margin-top:16px"><h3>새 커리어</h3><p class="desc">새 선수를 만들면 현재 저장된 게임 데이터가 초기화돼. 기존 데이터를 유지하려면 먼저 백업 파일을 내려받아 줘.</p><button class="btn danger" onclick="confirmNewCareer()">새 커리어 시작</button></div><div class="card" style="margin-top:16px"><h3>게임 업데이트</h3><p class="desc">현재 버전 v${GAME_VERSION} · 웹 배포 시 새 버전을 자동 확인하고 적용할 수 있어.</p><button class="btn secondary" onclick="switchTab('updates')">업데이트 내역 및 연결 설정 →</button></div><div class="footer-note">자동 저장은 이 브라우저의 localStorage를 사용합니다. 브라우저 데이터 삭제 시 저장 파일이 지워질 수 있으니 백업 기능을 이용하세요. 인터넷 연결 없이 실행 가능한 단일 HTML 게임입니다.</div>`}
function showModal(title,body,onConfirm=null,buttonText='확인'){modalAction=onConfirm;document.getElementById('modalRoot').innerHTML=`<div class="modal-back" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">${title}</h2>${body}<div class="modal-actions"><button class="btn ${onConfirm?'secondary':'wide'}" onclick="closeModal()">${onConfirm?'취소':'닫기'}</button>${onConfirm?`<button class="btn" onclick="confirmModal()">${buttonText}</button>`:''}</div></div></div>`}
function confirmModal(){if(modalAction){const fn=modalAction;modalAction=null;fn()}}
function closeModal(){document.getElementById('modalRoot').innerHTML='';modalAction=null;if(updatePrefs.enabled&&updateInfo.latest&&compareVersions(updateInfo.latest,GAME_VERSION)>0)setTimeout(autoApplyUpdate,0)}
function confirmRetirement(){if(!state||state.retired)return;showModal('은퇴를 확정할까?',`<p class="desc">${esc(state.player.name)} 선수는 ${state.age}세에 은퇴하게 돼. 은퇴 후에는 같은 커리어에서 시즌을 더 진행할 수 없어.</p><div class="notice">은퇴는 되돌릴 수 없어. 필요한 경우 설정에서 저장 데이터를 백업해 줘.</div>`,()=>retireNow('선수 본인의 조기 은퇴'),'은퇴 확정')}
function retireNow(reason){state.retired=true;state.stage='RETIRED';state.retireReason=reason;state.market={offers:[],required:false,kind:null,interest:[],tradeRequested:false};state.events.unshift({year:state.year,text:`${state.age}세 은퇴 · 역대 ${goatRank(state)}위`});save();closeModal();tab='goat';render();toast('커리어가 종료됐어. 최종 GOAT 기록을 확인해 줘.')}
function confirmNewCareer(){showModal('새 커리어 시작',`<p class="desc">현재 ${esc(state.player.name)} 선수의 모든 기록이 삭제되고 새 선수 생성 화면으로 돌아가. 기존 기록이 필요하면 먼저 백업해 줘.</p>`,()=>{localStorage.removeItem(SAVE);state=null;closeModal();render()},'새로 시작')}
function exportSave(){const data=JSON.stringify(state,null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ROAD_TO_GOAT_'+state.player.name.replace(/[^a-zA-Z0-9가-힣]/g,'_')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('백업 파일을 저장했어.')}
function importSave(event){let file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.version!==1||!obj.player||!obj.history||!obj.awards||!obj.attrs)throw Error('invalid');state=ensureV13(obj);save();tab='home';render();toast('커리어 백업을 불러왔어.')}catch(e){toast('올바른 ROAD TO GOAT 백업 파일이 아니야.')}};reader.readAsText(file)}

// v1.5 change log & optional online updater. Never attempts to rewrite a local HTML file.
let updatePrefs={enabled:true,endpoint:''};
let updateInfo={kind:'idle',message:'업데이트를 확인하지 않았어.',latest:null,manifest:null};
let updateBusy=false;
try{const p=JSON.parse(localStorage.getItem(UPDATE_CONFIG_KEY)||'{}');if(typeof p.enabled==='boolean')updatePrefs.enabled=p.enabled;if(typeof p.endpoint==='string')updatePrefs.endpoint=p.endpoint;}catch(e){}
const isHosted=()=>location.protocol==='https:'||location.protocol==='http:';
function compareVersions(a,b){const nums=x=>String(x||'0').split(/[.-]/).slice(0,3).map(x=>Number.parseInt(x,10)||0);const A=nums(a),B=nums(b);for(let i=0;i<3;i++){if(A[i]!==B[i])return A[i]-B[i];}return 0;}
function updateStatusHtml(){return `<div class="update-status ${esc(updateInfo.kind)}" id="updateStatusText" role="status">${esc(updateInfo.message)}</div>`}
function latestUpdateControls(){return updateInfo.latest&&compareVersions(updateInfo.latest,GAME_VERSION)>0?`<button class="btn" onclick="applyAvailableUpdate()">↻ v${esc(updateInfo.latest)} 지금 업데이트</button>`:''}
function renderUpdateCenter(){return `${panelTitle('업데이트 내역',`<span class="pill blue">현재 v${GAME_VERSION}</span>`)}<div class="update-box"><div class="section-top"><h3>자동 업데이트</h3><span class="pill ${isHosted()?'blue':'gold'}">${isHosted()?'웹 연결 준비':'로컬 파일 모드'}</span></div><p class="desc" style="margin-bottom:10px">${isHosted()?'웹 서버에 배포된 version.json을 주기적으로 확인해. 새 버전이 있으면 진행 중인 커리어를 저장한 뒤 같은 사이트에서 새 게임을 불러와.':'다운로드한 HTML은 브라우저에서 자동으로 덮어쓸 수 없어. 웹사이트에 배포하면 자동 업데이트를 사용할 수 있어.'}</p><label class="switch-label"><input type="checkbox" id="autoUpdateToggle" ${updatePrefs.enabled?'checked':''} onchange="setAutoUpdate(this.checked)">새 버전 자동 확인 및 안전할 때 적용</label><div class="field" style="margin-top:13px"><label for="manifestUrl">업데이트 정보 주소 (배포용)</label><input id="manifestUrl" type="url" placeholder="비워두면 같은 사이트의 version.json 사용" value="${esc(updatePrefs.endpoint)}" autocomplete="off"></div><div class="update-actions"><button class="btn secondary" onclick="saveUpdateEndpoint()">업데이트 주소 저장</button><button class="btn" id="checkUpdateBtn" onclick="checkForUpdates(true)">↻ 지금 확인</button>${latestUpdateControls()}</div>${updateStatusHtml()}${!isHosted()?`<p class="smallnote" style="margin-top:10px">현재는 로컬 HTML 모드라 자동 업데이트를 연결할 수 없어. 배포용 ZIP을 웹 호스팅에 올리면 지원돼.</p>`:''}</div><div style="margin-top:20px" class="section-top"><h3>업데이트 기록</h3><span class="version-chip">최근 ${RELEASE_NOTES.length}개 버전</span></div>${RELEASE_NOTES.map((r,i)=>`<section class="update-row ${i===0?'latest':''}"><div class="release-title"><div><strong>v${esc(r.version)} · ${esc(r.title)}</strong><div class="smallnote" style="margin-top:5px">${esc(r.date)}</div></div>${i===0?'<span class="pill blue">현재 버전</span>':''}</div><ul>${r.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}`}
function updateBanner(){return updateInfo.latest&&compareVersions(updateInfo.latest,GAME_VERSION)>0?`<div class="update-banner"><div><strong>🚀 새 버전 v${esc(updateInfo.latest)} 출시!</strong><div class="smallnote">게임을 저장하고 최신 버전을 적용할 수 있어.</div></div><button class="btn small" onclick="applyAvailableUpdate()">업데이트</button></div>`:''}
function openGameMenu(){const has=!!state;document.getElementById('modalRoot').innerHTML=`<div class="modal-back" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal menu-dialog" role="dialog" aria-modal="true" aria-labelledby="mainMenuTitle"><div class="menu-heading"><div><div class="eyebrow">ROAD TO GOAT v${GAME_VERSION}</div><h2 id="mainMenuTitle">☰ 게임 메뉴</h2></div><button class="btn secondary small" onclick="closeModal()">닫기 ✕</button></div><div class="menu-grid"><button class="menu-tile" onclick="goMenuTab('home')"><span class="tile-icon">🏠</span><strong>${has?'커리어 계속하기':'선수 생성으로 돌아가기'}</strong><small>${has?'내 선수와 현재 시즌 확인':'고1부터 커리어 시작'}</small></button><button class="menu-tile" onclick="goMenuTab('history')" ${has?'':'disabled'}><span class="tile-icon">📊</span><strong>시즌 기록</strong><small>연도별 누적 성적 보기</small></button><button class="menu-tile" onclick="goMenuTab('updates')"><span class="tile-icon">🔄</span><strong>업데이트 내역</strong><small>새 버전 확인 · 변경 사항</small></button><button class="menu-tile" onclick="goMenuTab('settings')" ${has?'':'disabled'}><span class="tile-icon">⚙️</span><strong>설정 및 저장</strong><small>백업 · 은퇴 · 새 커리어</small></button></div><div class="menu-footer"><span class="smallnote">${has?`${esc(state.player.name)} · ${state.year} 시즌 · 저장됨`:'새 커리어 생성 전'} | v${GAME_VERSION}</span><button class="btn small secondary" onclick="menuUpdateCheck()">↻ 업데이트 확인</button></div>${updateStatusHtml()}</div></div>`;}
function goMenuTab(t){closeModal();if(t==='updates'&&!state){showReleaseNotesModal();return;}if(!state){renderIntro();return;}switchTab(t);}
function showReleaseNotesModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal menu-dialog" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle"><div class="menu-heading"><div><div class="eyebrow">PATCH NOTES</div><h2 id="updateModalTitle">업데이트 내역</h2></div><button class="btn secondary small" onclick="closeModal()">닫기 ✕</button></div>${RELEASE_NOTES.slice(0,4).map((r,i)=>`<section class="update-row ${i===0?'latest':''}"><strong>v${esc(r.version)} · ${esc(r.title)}</strong><div class="smallnote">${esc(r.date)}</div><ul>${r.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}<p class="smallnote">다운로드형 HTML에서 자동으로 파일을 교체할 수는 없어. 웹 배포 후 업데이트 확인 가능해.</p>${updateStatusHtml()}</div></div>`;}
function notifyUpdater(){if(tab==='updates'&&state){document.getElementById('pageContent').innerHTML=renderUpdateCenter();}const el=document.getElementById('updateStatusText');if(el){el.textContent=updateInfo.message;el.className='update-status '+updateInfo.kind}}
function setAutoUpdate(enabled){updatePrefs.enabled=!!enabled;saveUpdatePrefs();updateInfo={...updateInfo,kind:'ok',message:enabled?'자동 업데이트 확인을 켰어.':'자동 업데이트 확인을 껐어.'};notifyUpdater();if(enabled&&isHosted())setTimeout(()=>checkForUpdates(false),0);}
function saveUpdatePrefs(){try{localStorage.setItem(UPDATE_CONFIG_KEY,JSON.stringify(updatePrefs))}catch(e){toast('업데이트 설정을 저장하지 못했어.')}}
function saveUpdateEndpoint(){const val=(document.getElementById('manifestUrl')?.value||'').trim();if(val&&!/^https:\/\//i.test(val)){toast('업데이트 주소는 https:// 주소만 입력해 줘.');return;}updatePrefs.endpoint=val;saveUpdatePrefs();toast('업데이트 주소를 저장했어.');checkForUpdates(true);}
function makeManifestUrl(){if(updatePrefs.endpoint)return updatePrefs.endpoint;return new URL('version.json',location.href).href;}
async function menuUpdateCheck(){closeModal();if(state){tab='updates';render();}else{showReleaseNotesModal();}await checkForUpdates(true);}
async function checkForUpdates(manual=false){if(updateBusy)return;if(!isHosted()){updateInfo={kind:'error',message:'로컬 HTML은 자동 업데이트를 받을 수 없어. 웹 호스팅 배포 후 연결할 수 있어.',latest:null,manifest:null};notifyUpdater();if(manual)toast('웹에 배포해야 업데이트를 확인할 수 있어.');return;}
 updateBusy=true;updateInfo={...updateInfo,kind:'idle',message:'서버에서 최신 버전을 확인하는 중…'};notifyUpdater();
 try{const res=await fetch(makeManifestUrl()+(makeManifestUrl().includes('?')?'&':'?')+'_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!res.ok)throw Error('서버 응답 '+res.status);const m=await res.json();if(typeof m.version!=='string'||!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(m.version))throw Error('버전 정보 형식 오류');
  const newer=compareVersions(m.version,GAME_VERSION)>0;updateInfo={kind:newer?'available':'ok',message:newer?`최신 버전 v${m.version}이(가) 있어. ${m.notes?.[0]||'업데이트할 수 있어.'}`:`최신 버전을 사용 중이야. (v${GAME_VERSION})`,latest:m.version,manifest:m};notifyUpdater();if(newer&&updatePrefs.enabled)autoApplyUpdate();
 }catch(e){updateInfo={kind:'error',message:'업데이트 서버를 확인할 수 없어. 배포한 version.json 주소를 확인해 줘. ('+String(e.message||e)+')',latest:null,manifest:null};notifyUpdater();}finally{updateBusy=false}}
function updateTarget(){let candidate=updateInfo.manifest?.url||'index.html';let u;try{u=new URL(candidate,makeManifestUrl())}catch(e){return null;}if(u.origin!==location.origin||!/^https?:$/.test(u.protocol))return null;return u;}
function canApplyUpdate(){return !busy&&!replayTimer&&!document.querySelector('.modal-back')&&!state?.pendingIntl;}
function autoApplyUpdate(){if(!canApplyUpdate())return;const v=updateInfo.latest;if(!v||sessionStorage.getItem('rtg_update_attempt')===v)return;const target=updateTarget();if(!target){updateInfo.kind='available';updateInfo.message='새 버전이 있어. 다른 사이트로 이동하는 업데이트는 자동 적용하지 않아. 같은 사이트의 배포 주소를 사용해 줘.';notifyUpdater();return;}
 save();sessionStorage.setItem('rtg_update_attempt',v);target.searchParams.set('v',v);location.replace(target.href);}
function applyAvailableUpdate(){const target=updateTarget();if(!target){toast('안전한 같은 사이트 업데이트 주소를 확인해 줘.');return;}if(!canApplyUpdate()){toast('진행 중인 경기나 메시지를 마친 뒤 업데이트해 줘.');return;}save();sessionStorage.setItem('rtg_update_attempt',updateInfo.latest||'');target.searchParams.set('v',updateInfo.latest||GAME_VERSION);location.assign(target.href);}
function initUpdater(){if(isHosted()){if(updatePrefs.enabled)setTimeout(()=>checkForUpdates(false),1000);setInterval(()=>{if(updatePrefs.enabled)checkForUpdates(false)},15*60*1000);window.addEventListener('focus',()=>{if(updatePrefs.enabled)checkForUpdates(false)});}window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal();});}

state=load();render();initUpdater();
</script>
